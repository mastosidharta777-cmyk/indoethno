name: Site mode isolation smoke

on:
  push:
    branches:
      - codex/enforce-site-mode-api-isolation

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site_mode: [coming-soon, pilot]
    env:
      SITE_MODE: ${{ matrix.site_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start Next dev server
        run: |
          nohup npm run dev -- --hostname 127.0.0.1 -p 3100 > /tmp/indoethno-next.log 2>&1 &
          echo $! > /tmp/indoethno-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3100/ >/tmp/root.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/indoethno-next.log
          exit 1
      - name: Verify mode boundary
        shell: bash
        run: |
          set -euo pipefail
          status() { curl -sS -o "$2" -w '%{http_code}' "$1"; }
          post_status() { curl -sS -o "$3" -w '%{http_code}' -X POST "$1" -H 'content-type: application/json' --data "$2"; }

          root=$(status http://127.0.0.1:3100/ /tmp/root.html)
          destination=$(status http://127.0.0.1:3100/destination/yogyakarta /tmp/destination.html)
          music=$(status http://127.0.0.1:3100/music/jogja-hip-hop-foundation /tmp/music.html)
          plan=$(status http://127.0.0.1:3100/plan /tmp/plan.html)
          request_page=$(status http://127.0.0.1:3100/request-experience /tmp/request-page.html)
          experience_api=$(post_status http://127.0.0.1:3100/api/experience-requests '{"groupSize":2,"contact":"qa@example.com"}' /tmp/experience-api.json)
          waitlist_api=$(post_status http://127.0.0.1:3100/api/waitlist '{"email":"qa@example.com","consent":true,"website":""}' /tmp/waitlist-api.json)

          echo "mode=$SITE_MODE root=$root destination=$destination music=$music plan=$plan request=$request_page experience_api=$experience_api waitlist_api=$waitlist_api"

          test "$root" = 200

          if [ "$SITE_MODE" = coming-soon ]; then
            grep -q 'Coming Soon' /tmp/root.html
            test "$destination" = 404
            test "$music" = 404
            test "$plan" = 404
            test "$request_page" = 404
            test "$experience_api" = 404
            test "$waitlist_api" = 503
          else
            grep -q 'Yogyakarta pilot' /tmp/root.html
            test "$destination" = 200
            test "$music" = 200
            test "$plan" = 200
            test "$request_page" = 200
            test "$experience_api" = 503
            test "$waitlist_api" = 404
          fi
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/indoethno-next.log || true
